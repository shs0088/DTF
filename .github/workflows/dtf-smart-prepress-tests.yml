name: DTF Smart Prepress tests

on:
  push:
    branches: [chatgpt/dtf-smart-prepress-20260928]
    paths:
      - "DTF_SMART_PREPRESS_TOOL/**"
      - ".github/workflows/dtf-smart-prepress-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DTF_SMART_PREPRESS_TOOL
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            DTF_SMART_PREPRESS_TOOL/requirements.txt
            DTF_SMART_PREPRESS_TOOL/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -v
