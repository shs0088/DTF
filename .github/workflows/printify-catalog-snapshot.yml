name: Refresh Printify catalog snapshot
on:
  workflow_dispatch:
  push:
    branches:
      - camel-current
concurrency:
  group: printify-catalog-snapshot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: camel-current
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate and validate snapshot
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
        run: node scripts/generate-printify-catalog-snapshot.mjs --output public/data/printify-catalog.json
      - name: Commit changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/printify-catalog.json
          git diff --cached --quiet || git commit -m "chore(printify): refresh catalog snapshot"
          git push origin HEAD:camel-current