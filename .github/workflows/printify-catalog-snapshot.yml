name: Refresh Printify catalog snapshot\non:\n  workflow_dispatch:\nconcurrency:\n  group: printify-catalog-snapshot\n  cancel-in-progress: false\npermissions:\n  contents: write\njobs:\n  refresh:\n    runs-on: ubuntu-latest\n    timeout-minutes: 10\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          ref: camel-current\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 20\n      - name: Generate and validate snapshot\n        env:\n          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}\n        run: node scripts/generate-printify-catalog-snapshot.mjs --output public/data/printify-catalog.json\n      - name: Commit changed snapshot\n        run: |\n          git config user.name "github-actions[bot]"\n          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n          git add public/data/printify-catalog.json\n          git diff --cached --quiet || git commit -m "chore(printify): refresh catalog snapshot"\n          git push origin HEAD:camel-current