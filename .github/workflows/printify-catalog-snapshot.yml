name: Refresh Printify catalog snapshot
on:
  workflow_dispatch:
concurrency:
  group: printify-catalog-snapshot-${{ github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  refresh:
    if: startsWith(github.ref_name, 'verify/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate and validate snapshot
        env:
          PRINTIFY_API_TOKEN: ${{ secrets.PRINTIFY_API_TOKEN }}
        run: node scripts/generate-printify-catalog-snapshot.mjs --output public/data/printify-catalog.json
      - name: Validate generated snapshot without write-back
        run: git diff --check && git diff -- public/data/printify-catalog.json
