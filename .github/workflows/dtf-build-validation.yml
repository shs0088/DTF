name: DTF build validation
on:
  push:
    branches:
      - 'verify/**'
      - 'integrate/**'
      - camel-current
      - kamel/admin-rbac-foundation
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch under validation
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Confirm Bun version
        run: bun --version
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: ItemStore initialization regression test
        run: bun test item-store-initialization.test.ts
      - name: RBAC tests
        run: bun test workers/admin-rbac.test.ts
      - name: Orders tests
        run: bun test workers/admin-orders.test.ts
      - name: Production tests
        run: bun test workers/admin-production.test.ts
      - name: Manual Review tests
        run: bun test workers/admin-manual-review.test.ts
      - name: Products tests
        run: bun test workers/admin-products.test.ts
      - name: Customers tests
        run: bun test workers/admin-customers.test.ts
      - name: Designers tests
        run: bun test workers/admin-designers.test.ts
      - name: Payouts tests
        run: bun test workers/admin-payouts.test.ts
      - name: Reports tests
        run: bun test workers/admin-reports.test.ts
      - name: Promotions tests
        run: bun test workers/admin-promotions.test.ts
      - name: Settings tests
        run: bun test workers/admin-settings.test.ts
      - name: Integrations tests
        run: bun test workers/admin-integrations.test.ts
      - name: Admin i18n tests
        run: bun test workers/admin-i18n.test.ts
      - name: Audit Log tests
        run: bun test workers/admin-audit-log.test.ts
      - name: Checkout Integration tests
        run: bun test workers/checkout-integration.test.ts
      - name: Designer Upload tests
        run: bun test workers/analyzer.test.ts workers/designer-upload.test.ts
      - name: Local Cloudflare Worker RBAC smoke
        shell: bash
        run: |
          set -euo pipefail

          node --check scripts/rbac-local-smoke.mjs

          WRANGLER_VERSION="$(./node_modules/.bin/wrangler --version)"
          echo "Wrangler: $WRANGLER_VERSION"
          echo "$WRANGLER_VERSION" | grep -q "4.97.0"

          TEST_TOKEN="dtf-ci-bootstrap-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TEST_HASH="$(printf '%s' "$TEST_TOKEN" | sha256sum | awk '{print $1}')"

          printf 'ADMIN_WEB_KEY="%s"\nADMIN_BOOTSTRAP_TOKEN_SHA256="%s"\n' \
            'dtf-ci-local-session-key-0123456789012345678901234567890123456789' \
            "$TEST_HASH" > .dev.vars

          STATE_DIR="/tmp/dtf-rbac-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf "$STATE_DIR"

          cleanup() {
            if [ -n "${WRANGLER_PID:-}" ]; then
              kill "$WRANGLER_PID" 2>/dev/null || true
              wait "$WRANGLER_PID" 2>/dev/null || true
            fi
            rm -f .dev.vars
            rm -rf "$STATE_DIR"
          }

          trap cleanup EXIT

          # Diagnose the exact failing initialization statement without committing
          # any change to the protected ItemStore source. This edit exists only
          # inside the disposable GitHub Actions checkout.
          python3 - <<'PY'
          from pathlib import Path
          path = Path('workers/item-store.ts')
          text = path.read_text(encoding='utf-8')
          old = 'if (ch === ";") { const statement = script.slice(start, i).trim(); if (statement) storage.exec(statement); start = i + 1; }'
          new = 'if (ch === ";") { const statement = script.slice(start, i).trim(); if (statement) { try { storage.exec(statement); } catch (error) { console.error("ITEMSTORE_SQL_FAILURE", statement.slice(0, 1200)); throw error; } } start = i + 1; }'
          if old not in text:
              raise SystemExit('execSqlScript statement pattern not found')
          text = text.replace(old, new, 1)
          old_tail = 'const tail = script.slice(start).trim();\n  if (tail) storage.exec(tail);'
          new_tail = 'const tail = script.slice(start).trim();\n  if (tail) { try { storage.exec(tail); } catch (error) { console.error("ITEMSTORE_SQL_FAILURE", tail.slice(0, 1200)); throw error; } }'
          if old_tail not in text:
              raise SystemExit('execSqlScript tail pattern not found')
          path.write_text(text.replace(old_tail, new_tail, 1), encoding='utf-8')
          PY

          ./node_modules/.bin/wrangler dev \
            --local \
            --ip 127.0.0.1 \
            --port 8787 \
            --persist-to "$STATE_DIR" \
            > /tmp/dtf-wrangler.log 2>&1 &

          WRANGLER_PID=$!
          READY=0

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/api/studio/health >/dev/null 2>&1; then
              READY=1
              break
            fi

            if ! kill -0 "$WRANGLER_PID" 2>/dev/null; then
              echo "Wrangler exited before becoming ready."
              cat /tmp/dtf-wrangler.log
              exit 1
            fi

            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "Worker failed readiness check."
            cat /tmp/dtf-wrangler.log
            exit 1
          fi

          DTF_RBAC_BOOTSTRAP_TOKEN="$TEST_TOKEN" node scripts/rbac-local-smoke.mjs
