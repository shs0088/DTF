name: Camel current verification
on:
  push:
    branches:
      - 'verify/camel-current-20260919'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Analyzer and qualification validation tests
        run: bun test workers/analyzer.test.ts workers/qualification-upload.test.ts
