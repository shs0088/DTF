name: DTF build validation
on:
  push:
    branches:
      - camel-current
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout camel-current
        uses: actions/checkout@v4
        with:
          ref: camel-current
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
      - name: Printify unit tests
        run: bun test tests/printify-utils.test.ts
