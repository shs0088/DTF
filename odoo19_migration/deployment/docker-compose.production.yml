services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odoo}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${TZ:-Asia/Amman}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dtf_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-odoo}"]
      interval: 10s
      timeout: 5s
      retries: 15
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  odoo:
    image: ${ODOO_IMAGE:-odoo:19.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odoo}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:?ODOO_ADMIN_PASSWORD is required}
      ODOO_WORKERS: ${ODOO_WORKERS:-2}
      TZ: ${TZ:-Asia/Amman}
    command:
      - /bin/sh
      - -ec
      - |
        cat > /tmp/odoo.conf <<EOF
        [options]
        admin_passwd = $${ODOO_ADMIN_PASSWORD}
        db_host = db
        db_port = 5432
        db_user = $${POSTGRES_USER}
        db_password = $${POSTGRES_PASSWORD}
        dbfilter = ^$${POSTGRES_DB}$$
        list_db = False
        proxy_mode = True
        workers = $${ODOO_WORKERS}
        max_cron_threads = 1
        limit_time_cpu = 120
        limit_time_real = 240
        limit_request = 8192
        addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
        EOF
        exec odoo -c /tmp/odoo.conf -d "$${POSTGRES_DB}"
    volumes:
      - odoo_data:/var/lib/odoo
      - ../odoo/custom_addons:/mnt/extra-addons:ro
    expose:
      - "8069"
      - "8072"
    networks:
      - dtf_internal
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    depends_on:
      - odoo
    environment:
      DTF_ODOO_DOMAIN: ${DTF_ODOO_DOMAIN:?DTF_ODOO_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.production.conf.template:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - dtf_internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q '^ok$'"]
      interval: 30s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  certbot:
    image: ${CERTBOT_IMAGE:-certbot/certbot:latest}
    profiles:
      - tls-bootstrap
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    ports:
      - "80:80"

volumes:
  postgres_data:
  odoo_data:
  letsencrypt:
  certbot_www:

networks:
  dtf_internal:
    driver: bridge
