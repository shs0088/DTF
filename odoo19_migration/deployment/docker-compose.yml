services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odoo}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${TZ:-Asia/Amman}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dtf_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-odoo}"]
      interval: 10s
      timeout: 5s
      retries: 15

  odoo:
    image: ${ODOO_IMAGE:-odoo:19.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:?ODOO_ADMIN_PASSWORD is required}
      TZ: ${TZ:-Asia/Amman}
    command:
      - /bin/sh
      - -ec
      - |
        cat > /tmp/odoo.conf <<EOF
        [options]
        admin_passwd = $${ODOO_ADMIN_PASSWORD}
        db_host = db
        db_port = 5432
        db_user = $${POSTGRES_USER}
        db_password = $${POSTGRES_PASSWORD}
        proxy_mode = True
        addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
        EOF
        exec odoo -c /tmp/odoo.conf
    volumes:
      - odoo_data:/var/lib/odoo
      - ../odoo/custom_addons:/mnt/extra-addons:ro
    expose:
      - "8069"
      - "8072"
    networks:
      - dtf_internal

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    depends_on:
      - odoo
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - dtf_internal

volumes:
  postgres_data:
  odoo_data:

networks:
  dtf_internal:
    driver: bridge
